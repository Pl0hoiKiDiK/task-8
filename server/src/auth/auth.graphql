input AuthInput {
  email: String!
  password: String!
}

input SignupInput {
  email: String!
  password: String!
  confirmPassword: String!
}

type AuthResult {
  user: User!
  access_token: String!
  refresh_token: String!
}

input ForgotPasswordInput {
  email: String!
}

input ResetPasswordInput {
  newPassword: String!
  confirmPassword: String!
}

type UpdateTokenResult {
  access_token: String!
  refresh_token: String!
}

scalar Void

type Mutation {
  login(auth: AuthInput!): AuthResult!
  signup(auth: SignupInput!): AuthResult!
  forgotPassword(auth: ForgotPasswordInput!): Void
  resetPassword(auth: ResetPasswordInput!): Void
  updateToken: UpdateTokenResult!
}
